<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{{ title if title else "Flow Studio · Mindful Movement" }}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/main.css') }}">
  </head>
  <body>
    <nav class="nav">
      <a href="{{ url_for('index') }}" class="brand">Flow Studio</a>
      <div class="nav-links">
        <a href="{{ url_for('index') }}">Classes</a>
        <a href="{{ url_for('my_bookings') }}">My Bookings</a>
        <a href="{{ url_for('admin') }}">Dashboard</a>
      </div>
    </nav>
    <main class="container">
      {% block content %}{% endblock %}
    </main>

    <div id="toast" class="toast hidden"></div>
    {% block scripts %}{% endblock %}
  </body>
</html>
