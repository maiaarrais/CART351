{% extends "base.html" %}

{% block content %}
<style>
  /* Scoped styles to not interfere with base CSS */
  .form-wrap { max-width: 720px; margin: 16px auto; padding: 18px; background: #ffffff; border-radius: 12px; box-shadow: 0 2px 10px rgba(0,0,0,.06); }
  .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .form-row { display: flex; flex-direction: column; gap: 6px; }
  .form-row label { font-weight: 600; }
  .form-row input, .form-row textarea { padding: 10px; border-radius: 8px; border: 1px solid #d4d6da; font-size: 14px; }
  .form-row textarea { min-height: 120px; resize: vertical; }
  .full { grid-column: 1 / -1; }
  .actions { margin-top: 12px; display: flex; justify-content: flex-end; }
  .btn { background: rgb(167,69,112); color: #fff; border: none; padding: 10px 16px; border-radius: 8px; cursor: pointer; text-transform: uppercase; font-weight: 700; letter-spacing: .5px; }
  .btn:hover { opacity: .95; }
  .hint { font-size: 12px; color: #555; }
</style>

<div class="form-wrap">
  <h1 style="margin-bottom:10px;">Donuts form</h1>
  <p class="hint">Enter two short texts and a longer message. We’ll combine them and swap vowels for asterisks.</p>

  <!--method="get" and action to thank_you_t2 -->
  <form method="get" action="{{ url_for('thank_you_t2') }}">
    <div class="form-grid">
      <div class="form-row">
        <label for="first">First text</label>
        <input id="first" name="first" type="text" placeholder="e.g., Your name" required>
      </div>

      <div class="form-row">
        <label for="second">Second text</label>
        <input id="second" name="second" type="text" placeholder="e.g., A title or tag" required>
      </div>

      <div class="form-row full">
        <label for="notes">Notes</label>
        <textarea id="notes" name="notes" placeholder="Write something longer here..." required></textarea>
      </div>
    </div>

    <div class="actions">
      <button class="btn" type="submit">Submit</button>
    </div>
  </form>
</div>
{% endblock %}
